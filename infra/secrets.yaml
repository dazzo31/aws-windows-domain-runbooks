AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [UNTESTED REFERENCE TEMPLATE - LAB TESTING REQUIRED]
  WUU2-CLI Secrets Management and Encryption Infrastructure.
  Defines dedicated customer-managed KMS key and secret access policies.
  Grants narrow decrypt rights exclusively to Tier 0 AD Password Workers;
  fleet patch workers and standard operators are strictly denied access.
  Validated offline via parser syntax tests. Not deployed to live AWS account.
  Review change sets in isolated lab account before staging or production use.

Parameters:
  Environment:
    Type: String
    Default: lab
    AllowedValues: [lab, staging, prod]
    Description: Target deployment environment name.

  KeyAdministratorRoleArn:
    Type: String
    Default: "arn:aws:iam::123456789012:role/wuu-admin-role"
    Description: IAM Role permitted to administer the KMS encryption key.

  AdPasswordWorkerRoleArn:
    Type: String
    Default: "arn:aws:iam::123456789012:role/wuu-ad-password-worker-lab"
    Description: IAM Role ARN of the dedicated AD Password Worker permitted to decrypt credentials.

Resources:
  # ===============================================================================================
  # Customer Managed KMS Key for WUU Credentials & Durable State
  # ===============================================================================================
  WuuKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "WUU KMS Key for SecureString credentials and durable state encryption (${Environment})"
      EnableKeyRotation: true
      MultiRegion: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Id: "wuu-kms-key-policy"
        Statement:
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Ref KeyAdministratorRoleArn
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:Disable*"
              - "kms:Get*"
              - "kms:Delete*"
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
            Resource: "*"

          - Sid: AllowDecryptionOnlyToAdPasswordWorkerViaSsm
            Effect: Allow
            Principal:
              AWS: !Ref AdPasswordWorkerRoleArn
            Action:
              - "kms:Decrypt"
              - "kms:DescribeKey"
            Resource: "*"
            Condition:
              StringEquals:
                "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"

          - Sid: ExplicitDenyToFleetPatchNodesAndOperators
            Effect: Deny
            Principal: "*"
            Action:
              - "kms:Decrypt"
            Resource: "*"
            Condition:
              StringLike:
                "aws:PrincipalArn":
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/wuu-managed-node-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/wuu-operator-*"

  WuuKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/wuu-credentials-${Environment}"
      TargetKeyId: !Ref WuuKmsKey

Outputs:
  KmsKeyArn:
    Value: !GetAtt WuuKmsKey.Arn
    Export:
      Name: !Sub "${Environment}-WuuKmsKeyArn"
  KmsKeyAliasName:
    Value: !Ref WuuKmsKeyAlias
    Export:
      Name: !Sub "${Environment}-WuuKmsKeyAlias"
  KmsKeyIsMultiRegion:
    Value: "true"
    Export:
      Name: !Sub "${Environment}-WuuKmsKeyIsMultiRegion"

