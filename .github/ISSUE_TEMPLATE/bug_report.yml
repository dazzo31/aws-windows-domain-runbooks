name: Bug Report / Spec Defect
description: Report a defect, schema validation failure, or script error in an offline specification or runbook.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report!
        > [!WARNING]
        > **DO NOT INCLUDE REAL SECRETS, CREDENTIALS, OR LIVE AWS ACCOUNT IDS.**
        > For security vulnerabilities, use [Private Vulnerability Reporting](https://github.com/dazzo31/aws-windows-domain-runbooks/security/advisories/new).
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which area of the repository is affected?
      options:
        - "SSM Automation Document (documents/)"
        - "Operational Runbook (runbooks/)"
        - "CloudFormation Template (infra/)"
        - "Step Functions & Lambda (cloud/)"
        - "PowerShell Worker Module (workers/)"
        - "Deployment / Test Script (scripts/ or tests/)"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Clear and concise description of the bug or specification defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the issue (e.g., `npm test`, `node tests/read-documents.cjs`).
      placeholder: |
        1. Run `npm test`
        2. Inspect output error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened according to repository safety invariants?
    validations:
      required: true
  - type: checkboxes
    id: safety_checks
    attributes:
      label: Safety & Governance Checklist
      options:
        - label: "I confirm this report contains NO real AWS account numbers, access keys, passwords, or internal network topology."
          required: true
        - label: "I have verified this issue against the latest main branch."
          required: false
