schemaVersion: '2.2'
description: Inspect local machine certificates, request a template-based certificate or renew one machine certificate. No user-store enrollment, key export, CA signing-key renewal or application rebinding.
parameters:
  Action:
    type: String
    default: Inspect
    allowedValues: [Inspect, Request, Renew]
    interpolationType: ENV_VAR
  Template:
    type: String
    default: ''
    description: Template short name. Enrollment ACLs must restrict allowed templates.
    allowedPattern: '^[A-Za-z0-9_-]{0,64}$'
    interpolationType: ENV_VAR
  Thumbprint:
    type: String
    default: ''
    allowedPattern: '^([A-Fa-f0-9]{40})?$'
    interpolationType: ENV_VAR
  Apply:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  ChangeTicket:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9._/-]{0,100}$'
    interpolationType: ENV_VAR
mainSteps:
  - name: CertificateEnrollment
    action: aws:runPowerShellScript
    precondition:
      StringEquals: [platformType, Windows]
    inputs:
      timeoutSeconds: '600'
      runCommand:
        - |
          $ErrorActionPreference = 'Stop'
          if (!$env:SSM_Action -or !$env:SSM_Apply) { throw 'Missing ENV_VAR inputs; update SSM Agent.' }
          $before = @(Get-ChildItem Cert:\LocalMachine\My)
          $before | Select-Object Subject,Thumbprint,NotAfter,HasPrivateKey | ConvertTo-Json
          if ($env:SSM_Action -eq 'Inspect') { exit 0 }
          $old = $null
          if ($env:SSM_Action -eq 'Request' -and !$env:SSM_Template) { throw 'Request requires Template.' }
          if ($env:SSM_Action -eq 'Renew') {
              if (!$env:SSM_Thumbprint) { throw 'Renew requires Thumbprint.' }
              $old = Get-Item -LiteralPath ('Cert:\LocalMachine\My\' + $env:SSM_Thumbprint)
              if (!$old.HasPrivateKey) { throw 'Renewal requires the original machine private key.' }
                if ($old.NotAfter -le (Get-Date)) { throw 'Expired certificates must be replaced with a new request, not renewed.' }
              $constraints = @($old.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.19' })
              foreach ($extension in $constraints) {
                  $basic = [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($extension, $extension.Critical)
                  if ($basic.CertificateAuthority) { throw 'CA certificates cannot be renewed by this document.' }
              }
          }
          if ($env:SSM_Apply -ne 'true') { Write-Output "PREVIEW: $env:SSM_Action machine certificate. No changes made."; exit 0 }
          if (!$env:SSM_ChangeTicket) { throw 'Apply requires ChangeTicket.' }
          if ($env:SSM_Action -eq 'Request') {
              Import-Module PKI
              $result = Get-Certificate -Template $env:SSM_Template -CertStoreLocation Cert:\LocalMachine\My -Url 'ldap:'
              Write-Output "Enrollment status=$($result.Status)."
              if ([string]$result.Status -ne 'Issued') { throw 'Enrollment did not issue a certificate immediately. Review pending request; do not blindly retry.' }
              $result.Certificate | Select-Object Subject,Thumbprint,NotAfter,HasPrivateKey | ConvertTo-Json
          } else {
                & certreq.exe -enroll -machine -q -cert $env:SSM_Thumbprint Renew
              if ($LASTEXITCODE -ne 0) { throw "Machine renewal failed or is pending; exit=$LASTEXITCODE. Inspect the request before retrying." }
              $renewed = @(Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.Thumbprint -notin $before.Thumbprint -and $_.Subject -eq $old.Subject -and $_.Issuer -eq $old.Issuer -and $_.NotAfter -gt $old.NotAfter -and $_.HasPrivateKey })
              if ($renewed.Count -ne 1) { throw 'Could not uniquely verify an installed renewal. Inspect machine store and CA request records.' }
              $renewed | Select-Object Subject,Thumbprint,NotAfter,HasPrivateKey | ConvertTo-Json
          }
          Write-Output "APPLIED: $env:SSM_Action; ticket=$env:SSM_ChangeTicket. Application certificate binding has not been changed."