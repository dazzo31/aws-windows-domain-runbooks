schemaVersion: '2.2'
description: >
  [UNTESTED - LAB QUALIFICATION REQUIRED]
  Inspect/backup one GPO and link/unlink it at an OU.
  Does not edit policy settings, enforce links or touch default domain policies.
  Offline verified reference specification; requires lab qualification before live use.
parameters:
  Action:
    type: String
    default: Inspect
    allowedValues: [Inspect, Backup, Link, Unlink]
    interpolationType: ENV_VAR
  Server:
    type: String
    allowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$'
    interpolationType: ENV_VAR
  GpoId:
    type: String
    allowedPattern: '^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$'
    interpolationType: ENV_VAR
  TargetOU:
    type: String
    allowedPattern: '^OU=[^\r\n]{1,1000}$'
    interpolationType: ENV_VAR
  Apply:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  ChangeTicket:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9._/-]{0,100}$'
    interpolationType: ENV_VAR
mainSteps:
  - name: GPO
    action: aws:runPowerShellScript
    precondition:
      StringEquals: [platformType, Windows]
    inputs:
      timeoutSeconds: '600'
      runCommand:
        - |
          $ErrorActionPreference = 'Stop'
          if (!$env:SSM_Action -or !$env:SSM_Server -or !$env:SSM_GpoId -or !$env:SSM_TargetOU -or !$env:SSM_Apply) { throw 'Missing ENV_VAR inputs; update SSM Agent.' }
          Import-Module GroupPolicy
          Import-Module ActiveDirectory
          $domain = (Get-ADDomain -Server $env:SSM_Server).DNSRoot
          $target = Get-ADOrganizationalUnit -Identity $env:SSM_TargetOU -Server $env:SSM_Server
          $gpo = Get-GPO -Guid $env:SSM_GpoId -Domain $domain -Server $env:SSM_Server
          $inheritance = Get-GPInheritance -Target $target.DistinguishedName -Domain $domain -Server $env:SSM_Server
          $gpo | Select-Object Id,DisplayName,GpoStatus,CreationTime,ModificationTime | ConvertTo-Json
          $inheritance.GpoLinks | Select-Object GpoId,DisplayName,Enabled,Enforced,Order | ConvertTo-Json
          if ($env:SSM_Action -eq 'Inspect') { Get-GPOReport -Guid $gpo.Id -Domain $domain -Server $env:SSM_Server -ReportType Xml; exit 0 }
          if ($env:SSM_GpoId -in @('31b2f340-016d-11d2-945f-00c04fb984f9','6ac1786c-016f-11d2-945f-00c04fb984f9')) { throw 'Default domain policies are excluded from changes.' }
          if ($env:SSM_Apply -ne 'true') { Write-Output "PREVIEW: $env:SSM_Action GPO $env:SSM_GpoId at $env:SSM_TargetOU. No changes made."; exit 0 }
          if (!$env:SSM_ChangeTicket) { throw 'Apply requires ChangeTicket.' }
          $backupRoot = Join-Path $env:ProgramData ('WinDomain\GPOBackups\' + [guid]::NewGuid().ToString())
          $null = New-Item -Path $backupRoot -ItemType Directory -Force
          $inheritance.GpoLinks | Select-Object GpoId,Enabled,Enforced,Order | Export-Clixml -LiteralPath (Join-Path $backupRoot 'links.clixml')
          Backup-GPO -Guid $gpo.Id -Path $backupRoot -Domain $domain -Server $env:SSM_Server -Comment $env:SSM_ChangeTicket | Select-Object Id,GpoId,BackupDirectory | ConvertTo-Json
          $existing = @($inheritance.GpoLinks | Where-Object { $_.GpoId -eq $gpo.Id })
          if ($env:SSM_Action -eq 'Link') {
              if ($existing.Count) { throw 'Link exists; no automatic change to its order or enabled/enforced state.' }
              New-GPLink -Guid $gpo.Id -Target $target.DistinguishedName -Domain $domain -Server $env:SSM_Server -LinkEnabled Yes -Enforced No | Out-Null
          } elseif ($env:SSM_Action -eq 'Unlink' -and $existing.Count) {
              Remove-GPLink -Guid $gpo.Id -Target $target.DistinguishedName -Domain $domain -Server $env:SSM_Server -Confirm:$false
          }
          $after = Get-GPInheritance -Target $target.DistinguishedName -Domain $domain -Server $env:SSM_Server
          $link = @($after.GpoLinks | Where-Object { $_.GpoId -eq $gpo.Id })
          if ($env:SSM_Action -eq 'Link' -and ($link.Count -ne 1 -or !$link[0].Enabled)) { throw 'Link verification failed.' }
          if ($env:SSM_Action -eq 'Unlink' -and $link.Count) { throw 'Unlink verification failed.' }
          Write-Output "APPLIED: $env:SSM_Action; ticket=$env:SSM_ChangeTicket; backup=$backupRoot"