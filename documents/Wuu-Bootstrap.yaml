schemaVersion: '2.2'
description: >
  [UNTESTED - LAB QUALIFICATION REQUIRED]
  Qualifies and initializes pinned local WUU directories and security baselines on managed nodes without altering WSUS policy,
  joining domains, or elevating domain privileges. Offline verified reference specification; requires lab qualification before live use.
parameters:
  Action:
    type: String
    default: Qualify
    allowedValues: [Qualify, Bootstrap]
    interpolationType: ENV_VAR
  Apply:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  ChangeTicket:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9._/-]{0,100}$'
    interpolationType: ENV_VAR
mainSteps:
  - name: WuuBootstrap
    action: aws:runPowerShellScript
    precondition:
      StringEquals: [platformType, Windows]
    inputs:
      timeoutSeconds: '600'
      runCommand:
        - |
          $ErrorActionPreference = 'Stop'
          if (!$env:SSM_Action -or !$env:SSM_Apply) { throw 'Missing ENV_VAR inputs; update SSM Agent.' }

          # 1. Pinned Prerequisites Qualification
          $checks = @{}

          # PowerShell 5.1 verification
          $psMajor = $PSVersionTable.PSVersion.Major
          $psMinor = $PSVersionTable.PSVersion.Minor
          if ($psMajor -ne 5 -or $psMinor -ne 1) {
              throw "Unsupported PowerShell version: $($PSVersionTable.PSVersion). Windows PowerShell 5.1 is required."
          }
          $checks['PowerShell51'] = $true

          # COM STA / WUA API availability check
          try {
              $session = New-Object -ComObject Microsoft.Update.Session
              $checks['WuaComApi'] = ($null -ne $session)
          } catch {
              $checks['WuaComApi'] = $false
          }

          # SSM Agent version qualification (>= 3.3.2746.0)
          $ssmVersion = $null
          $ssmReg = 'HKLM:\SOFTWARE\Amazon\SSM'
          if (Test-Path $ssmReg) {
              $ssmVersion = (Get-ItemProperty $ssmReg).Version
          }
          if (!$ssmVersion -and (Test-Path "$env:ProgramFiles\Amazon\SSM\amazon-ssm-agent.exe")) {
              $ssmVersion = (Get-Item "$env:ProgramFiles\Amazon\SSM\amazon-ssm-agent.exe").VersionInfo.FileVersion
          }
          $checks['SsmAgentVersion'] = $ssmVersion

          # Invariant: WSUS policy preservation - verify policy exists but do NOT modify it
          $wuPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
          if (Test-Path $wuPolicy) {
              $wuProp = Get-ItemProperty $wuPolicy
              $checks['WsusConfigured'] = ($null -ne $wuProp.WUServer)
              $checks['WsusServerUrl'] = $wuProp.WUServer
          } else {
              $checks['WsusConfigured'] = $false
              $checks['WsusServerUrl'] = $null
          }

          # Invariant: Domain Admin / Privilege Isolation
          # Running under LocalSystem - must not request or hold Domain Admin rights
          $systemInfo = Get-CimInstance Win32_ComputerSystem
          $checks['DomainRole'] = $systemInfo.DomainRole
          $checks['PartOfDomain'] = $systemInfo.PartOfDomain
          $checks['Domain'] = $systemInfo.Domain

          # 2. Directory Validation & Baseline
          $wuuRoot = 'C:\ProgramData\WUU'
          $dirs = @(
              $wuuRoot,
              (Join-Path $wuuRoot 'locks'),
              (Join-Path $wuuRoot 'results'),
              (Join-Path $wuuRoot 'workers')
          )

          # Check for reparse points (symlinks/junctions prohibited)
          foreach ($d in $dirs) {
              if (Test-Path $d) {
                  $item = Get-Item $d
                  if ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
                      throw "Security violation: directory $d is a junction point or symlink."
                  }
              }
          }

          $checks | ConvertTo-Json

          if ($env:SSM_Action -eq 'Qualify') {
              Write-Output "QUALIFY: Pinned prerequisites verified on $env:COMPUTERNAME. No mutations performed."
              exit 0
          }

          # Apply gate
          if ($env:SSM_Apply -ne 'true') {
              Write-Output "PREVIEW: Bootstrap directories for $env:COMPUTERNAME. Action: $env:SSM_Action. Directories: $($dirs -join ', '). No changes made."
              exit 0
          }

          if (!$env:SSM_ChangeTicket) { throw 'Apply requires ChangeTicket.' }

          # 3. Apply: Directory Creation & Hardened ACLs
          foreach ($d in $dirs) {
              if (-not (Test-Path $d)) {
                  $null = New-Item -ItemType Directory -Path $d -Force
                  Write-Output "Created directory: $d"
              }

              $item = Get-Item $d
              if ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
                  throw "Security violation: directory $d is a junction point or symlink."
              }

              $acl = New-Object System.Security.AccessControl.DirectorySecurity
              $acl.SetAccessRuleProtection($true, $false)

              $adminRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
                  [System.Security.Principal.SecurityIdentifier]'S-1-5-32-544',
                  [System.Security.AccessControl.FileSystemRights]::FullControl,
                  [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
                  [System.Security.AccessControl.PropagationFlags]::None,
                  [System.Security.AccessControl.AccessControlType]::Allow
              )
              $systemRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
                  [System.Security.Principal.SecurityIdentifier]'S-1-5-18',
                  [System.Security.AccessControl.FileSystemRights]::FullControl,
                  [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
                  [System.Security.AccessControl.PropagationFlags]::None,
                  [System.Security.AccessControl.AccessControlType]::Allow
              )
              $acl.AddAccessRule($adminRule)
              $acl.AddAccessRule($systemRule)
              Set-Acl -Path $d -AclObject $acl
              Write-Output "Secured ACL on directory: $d (SYSTEM + Administrators only)"
          }

          Write-Output "Bootstrap completed successfully for $env:COMPUTERNAME under ChangeTicket: $env:SSM_ChangeTicket."

