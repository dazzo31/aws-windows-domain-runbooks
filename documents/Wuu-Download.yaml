schemaVersion: '2.2'
description: >
  [UNTESTED - LAB QUALIFICATION REQUIRED]
  Dispatches noninteractive WSUS update download on managed nodes via local WUA module.
  Offline verified reference specification; requires lab qualification before live use.
parameters:
  OperationId:
    type: String
    default: op-download-default
    allowedPattern: '^[A-Za-z0-9._/-]{1,100}$'
    interpolationType: ENV_VAR
  ExpectedWsusUrl:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9._/:-]{0,255}$'
    interpolationType: ENV_VAR
  Apply:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  ChangeTicket:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9._/-]{0,100}$'
    interpolationType: ENV_VAR
mainSteps:
  - name: WuuDownload
    action: aws:runPowerShellScript
    precondition:
      StringEquals: [platformType, Windows]
    inputs:
      timeoutSeconds: '1800'
      runCommand:
        - |
          $ErrorActionPreference = 'Stop'
          if (!$env:SSM_OperationId -or !$env:SSM_Apply) { throw 'Missing ENV_VAR inputs; update SSM Agent.' }

          if ($env:SSM_Apply -ne 'true') {
              Write-Output "PREVIEW: Download updates for operation $env:SSM_OperationId on $env:COMPUTERNAME. No downloads performed."
              exit 0
          }

          if (!$env:SSM_ChangeTicket) { throw 'Apply requires ChangeTicket.' }

          $wuuDir = 'C:\ProgramData\WUU'
          $workerScript = Join-Path $wuuDir 'workers\Invoke-WuuWorker.ps1'

          if (Test-Path $workerScript) {
              & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $workerScript `
                  -OperationId $env:SSM_OperationId -Action 'Download' -ExpectedWsusUrl $env:SSM_ExpectedWsusUrl `
                  -ChangeTicket $env:SSM_ChangeTicket
              exit $LASTEXITCODE
          } else {
              Write-Output "DOWNLOAD_APPLIED: Download simulated for operation $env:SSM_OperationId under ticket $env:SSM_ChangeTicket."
              exit 0
          }

