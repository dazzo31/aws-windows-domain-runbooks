schemaVersion: '2.2'
description: Inspect/upsert/remove one A or CNAME record on a Windows DNS server. Excludes apex and underscore-prefixed infrastructure records.
parameters:
  Action:
    type: String
    default: Inspect
    allowedValues: [Inspect, Upsert, Remove]
    interpolationType: ENV_VAR
  Zone:
    type: String
    allowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$'
    interpolationType: ENV_VAR
  RecordName:
    type: String
    allowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$'
    interpolationType: ENV_VAR
  RecordType:
    type: String
    default: A
    allowedValues: [A, CNAME]
    interpolationType: ENV_VAR
  Value:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9.-]{0,253}$'
    interpolationType: ENV_VAR
  Apply:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  ChangeTicket:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9._/-]{0,100}$'
    interpolationType: ENV_VAR
mainSteps:
  - name: DNS
    action: aws:runPowerShellScript
    precondition:
      StringEquals: [platformType, Windows]
    inputs:
      timeoutSeconds: '300'
      runCommand:
        - |
          $ErrorActionPreference = 'Stop'
          if (!$env:SSM_Action -or !$env:SSM_Zone -or !$env:SSM_RecordName -or !$env:SSM_RecordType -or !$env:SSM_Apply) { throw 'Missing ENV_VAR inputs; update SSM Agent.' }
          Import-Module DnsServer
          $zone = Get-DnsServerZone -Name $env:SSM_Zone
          if ($zone.ZoneType -ne 'Primary' -or $env:SSM_Zone -match '(^|\.)_msdcs\.' -or $env:SSM_RecordName -match '(^|\.)_') { throw 'Only primary application zones/records are supported.' }
          $records = @(Get-DnsServerResourceRecord -ZoneName $env:SSM_Zone | Where-Object { $_.HostName -eq $env:SSM_RecordName })
          $selected = @($records | Where-Object { $_.RecordType -eq $env:SSM_RecordType })
          $records | Select-Object HostName,RecordType,TimeToLive,RecordData | ConvertTo-Json -Depth 5
          if ($env:SSM_Action -eq 'Inspect') { exit 0 }
          if ($selected.Count -gt 1) { throw 'Multiple records of this type; refusing bulk modification.' }
          if ($env:SSM_Action -eq 'Upsert') {
              if (!$env:SSM_Value) { throw 'Upsert requires Value.' }
              if ($env:SSM_RecordType -eq 'A') {
                  $address = [System.Net.IPAddress]::Parse($env:SSM_Value)
                  if ($address.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) { throw 'Value must be IPv4.' }
                  if (@($records | Where-Object RecordType -eq 'CNAME').Count) { throw 'An existing CNAME conflicts with this A record.' }
              } elseif (@($records | Where-Object RecordType -ne 'CNAME').Count) { throw 'Existing records conflict with this CNAME.' }
          }
          if ($env:SSM_Apply -ne 'true') { Write-Output "PREVIEW: $env:SSM_Action $env:SSM_RecordType $env:SSM_RecordName.$env:SSM_Zone. No changes made."; exit 0 }
          if (!$env:SSM_ChangeTicket) { throw 'Apply requires ChangeTicket.' }
          $backupRoot = Join-Path $env:ProgramData 'WinDomain\DNSBackups'
          $null = New-Item -ItemType Directory -Path $backupRoot -Force
          $backup = Join-Path $backupRoot (([guid]::NewGuid().ToString()) + '.clixml')
          $records | Export-Clixml -LiteralPath $backup
          if ($env:SSM_Action -eq 'Remove') {
              if ($selected.Count) { Remove-DnsServerResourceRecord -ZoneName $env:SSM_Zone -InputObject $selected[0] -Force }
          } elseif ($selected.Count) {
              $updated = $selected[0].Clone()
              if ($env:SSM_RecordType -eq 'A') { $updated.RecordData.IPv4Address = $address }
              else { $updated.RecordData.HostNameAlias = $env:SSM_Value.TrimEnd('.') + '.' }
              Set-DnsServerResourceRecord -ZoneName $env:SSM_Zone -OldInputObject $selected[0] -NewInputObject $updated
          } elseif ($env:SSM_RecordType -eq 'A') {
              Add-DnsServerResourceRecordA -ZoneName $env:SSM_Zone -Name $env:SSM_RecordName -IPv4Address $address.IPAddressToString
          } else {
              Add-DnsServerResourceRecordCName -ZoneName $env:SSM_Zone -Name $env:SSM_RecordName -HostNameAlias ($env:SSM_Value.TrimEnd('.') + '.')
          }
          $after = @(Get-DnsServerResourceRecord -ZoneName $env:SSM_Zone | Where-Object { $_.HostName -eq $env:SSM_RecordName -and $_.RecordType -eq $env:SSM_RecordType })
          if ($env:SSM_Action -eq 'Remove' -and $after.Count) { throw 'Removal verification failed.' }
          if ($env:SSM_Action -eq 'Upsert') {
              if ($after.Count -ne 1) { throw 'Upsert verification failed.' }
              if ($env:SSM_RecordType -eq 'A' -and $after[0].RecordData.IPv4Address.IPAddressToString -ne $address.IPAddressToString) { throw 'Address verification failed.' }
              if ($env:SSM_RecordType -eq 'CNAME' -and $after[0].RecordData.HostNameAlias.TrimEnd('.') -ne $env:SSM_Value.TrimEnd('.')) { throw 'Alias verification failed.' }
          }
          Write-Output "APPLIED: $env:SSM_Action; ticket=$env:SSM_ChangeTicket; previous-records=$backup"
          $after | Select-Object HostName,RecordType,RecordData | ConvertTo-Json -Depth 5