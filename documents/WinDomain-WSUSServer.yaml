schemaVersion: '2.2'
description: Local WSUS diagnostics, targeted service/pool restart, asynchronous content reset, synchronization and one cleanup option. No SUSDB rebuild or IIS-wide reset.
parameters:
  Action:
    type: String
    default: Diagnose
    allowedValues: [Diagnose, RestartServices, ResetContent, Synchronize, Cleanup]
    interpolationType: ENV_VAR
  Port:
    type: String
    default: '8530'
    allowedValues: ['8530', '8531', '80', '443']
    interpolationType: ENV_VAR
  UseSsl:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  CleanupOption:
    type: String
    default: ObsoleteComputers
    allowedValues: [ObsoleteComputers, ObsoleteUpdates, UnneededContent, CompressUpdates, ExpiredUpdates, SupersededUpdates]
    interpolationType: ENV_VAR
  BackupConfirmed:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  Apply:
    type: String
    default: 'false'
    allowedValues: ['false', 'true']
    interpolationType: ENV_VAR
  ChangeTicket:
    type: String
    default: ''
    allowedPattern: '^[A-Za-z0-9._/-]{0,100}$'
    interpolationType: ENV_VAR
mainSteps:
  - name: WSUSServer
    action: aws:runPowerShellScript
    precondition:
      StringEquals: [platformType, Windows]
    inputs:
      timeoutSeconds: '14400'
      runCommand:
        - |
          $ErrorActionPreference = 'Stop'
          if (!$env:SSM_Action -or !$env:SSM_Port -or !$env:SSM_UseSsl -or !$env:SSM_Apply) { throw 'Missing ENV_VAR inputs; update SSM Agent.' }
          $setup = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Update Services\Server\Setup'
          $setup | Select-Object ContentDir,SqlServerName,SqlDatabaseName | ConvertTo-Json
          Get-Service -Name WsusService,W3SVC | Select-Object Name,Status | ConvertTo-Json
          Import-Module WebAdministration
          Get-WebAppPoolState -Name WsusPool
          Get-Item 'IIS:\AppPools\WsusPool' | Select-Object Name,state,queueLength,@{Name='PrivateMemoryKB';Expression={$_.recycling.periodicRestart.privateMemory}} | ConvertTo-Json
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Select-Object DeviceID,FreeSpace,Size | ConvertTo-Json
          $wsusUtil = Join-Path $env:ProgramFiles 'Update Services\Tools\wsusutil.exe'
          if (!(Test-Path -LiteralPath $wsusUtil)) { throw 'WSUS utilities are missing.' }
          Import-Module UpdateServices
          $connect = @{ Name = [System.Net.Dns]::GetHostEntry($env:COMPUTERNAME).HostName; PortNumber = [int]$env:SSM_Port }
          if ($env:SSM_UseSsl -eq 'true') { $connect.UseSsl = $true }
          $wsus = $null
          try {
              $wsus = Get-WsusServer @connect
              $subscription = $wsus.GetSubscription()
              $subscription.GetSynchronizationStatus().ToString()
              $subscription.GetLastSynchronizationInfo() | Select-Object StartTime,EndTime,Result | ConvertTo-Json
          } catch {
              if ($env:SSM_Action -ne 'RestartServices') { throw 'WSUS API connection failed. Check pool/services, SUSDB, configured port and TLS binding before cleanup.' }
              Write-Output 'WSUS API unavailable; a targeted service/pool restart can be previewed.'
          }
          if ($env:SSM_Action -eq 'Diagnose') { exit 0 }
          if ($env:SSM_Action -in @('Cleanup','Synchronize','ResetContent') -and $subscription.GetSynchronizationStatus().ToString() -ne 'NotProcessing') { throw 'Synchronization is already active; do not overlap maintenance.' }
          if ($env:SSM_Apply -ne 'true') { Write-Output "PREVIEW: $env:SSM_Action WSUS; cleanup=$env:SSM_CleanupOption. No changes made."; exit 0 }
          if (!$env:SSM_ChangeTicket) { throw 'Apply requires ChangeTicket.' }
          switch ($env:SSM_Action) {
              'RestartServices' {
                  if ((Get-Service W3SVC).Status -ne 'Running') { Start-Service W3SVC }
                  if ((Get-WebAppPoolState WsusPool).Value -eq 'Started') { Restart-WebAppPool WsusPool } else { Start-WebAppPool WsusPool }
                  Restart-Service WsusService
                  $wsus = Get-WsusServer @connect
                  $wsus.GetSubscription().GetSynchronizationStatus().ToString()
              }
              'ResetContent' {
                  & $wsusUtil reset
                  if ($LASTEXITCODE -ne 0) { throw 'wsusutil reset failed.' }
                  Write-Output 'Content validation/redownload initiated. Completion must be checked separately in WSUS logs and download status.'
              }
              'Synchronize' {
                  $subscription.StartSynchronization()
                  Write-Output 'Synchronization requested; inspect the subsequent result, not just this command status.'
              }
              'Cleanup' {
                  if ($env:SSM_BackupConfirmed -ne 'true') { throw 'Cleanup requires a verified SUSDB backup and BackupConfirmed=true.' }
                  $options = @{ UpdateServer = $wsus; Confirm = $false }
                  switch ($env:SSM_CleanupOption) {
                      'ObsoleteComputers' { $options.CleanupObsoleteComputers = $true }
                      'ObsoleteUpdates' { $options.CleanupObsoleteUpdates = $true }
                      'UnneededContent' { $options.CleanupUnneededContentFiles = $true }
                      'CompressUpdates' { $options.CompressUpdates = $true }
                      'ExpiredUpdates' { $options.DeclineExpiredUpdates = $true }
                      'SupersededUpdates' { $options.DeclineSupersededUpdates = $true }
                  }
                  Invoke-WsusServerCleanup @options
              }
          }
          Write-Output "APPLIED/REQUESTED: $env:SSM_Action; ticket=$env:SSM_ChangeTicket"